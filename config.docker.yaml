server:
  port: 8080
  jwt_secret: "replace-with-64-random-hex-jwt-secret"
  api_key_secret: "replace-with-different-64-random-hex-api-key-secret"
  jwt_expire_hours: 24
  trusted_proxies: []

db:
  host: "host-gateway"  # 宿主机 PostgreSQL 地址（docker-compose extra_hosts 将 host-gateway 映射到宿主机 IP，兼容 Linux/Mac/Windows）
  port: 5432
  user: postgres
  password: "change-me"
  dbname: fanapi
  sslmode: disable
  max_open_conns: 100
  max_idle_conns: 20
  conn_max_idle_sec: 300

redis:
  addr: "host-gateway:6379"  # 宿主机 Redis 地址
  password: ""
  db: 0

nats:
  url: "nats://host-gateway:4222"  # 宿主机 NATS 地址
  namespace: master
  task_stream: TASKS_master
  task_subject: "master.task.>"
  result_stream: RESULTS_master
  result_subject: "master.result.>"

smtp:
  host: smtp.example.com
  port: 465
  user: no-reply@example.com
  password: ""
  from: "FanAPI <no-reply@example.com>"
